<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c5cbf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mediathek">
  <title>Gemeinde-Mediathek</title>
  <meta name="description" content="Bilder, Gottesdienstaufnahmen, Texte und Dokumente unserer Gemeinde.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="wrap topbar-inner">
      <a href="#/" class="brand"><span class="brand-icon">⛪</span> <span class="brand-name">Gemeinde-Mediathek</span></a>
      <nav class="topnav">
        <a href="#/" data-nav="/">Start</a>
        <a href="#/aktuelles" data-nav="/aktuelles">Aktuelles</a>
        <a href="#/suche" data-nav="/suche">Suche</a>
        <a href="#/verwaltung" data-nav="/verwaltung" id="nav-admin" hidden>Verwaltung</a>
        <button class="btn small" id="nav-upload" hidden>＋ Hinzufügen</button>
        <a href="#/konto" data-nav="/konto" class="user-chip" id="nav-user" title="Mein Konto"></a>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite"></main>

  <nav class="bottomnav" id="bottomnav" hidden>
    <a href="#/" data-nav="/"><span>🏠</span>Start</a>
    <a href="#/aktuelles" data-nav="/aktuelles"><span>📢</span>Aktuelles</a>
    <a href="#/suche" data-nav="/suche"><span>🔍</span>Suche</a>
    <a href="#/verwaltung" data-nav="/verwaltung" id="bottom-admin" hidden><span>⚙️</span>Verwaltung</a>
    <a href="#/konto" data-nav="/konto"><span>👤</span>Konto</a>
  </nav>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-btn lb-close" aria-label="Schließen">✕</button>
    <button class="lb-btn lb-prev" aria-label="Vorheriges Bild">‹</button>
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <button class="lb-btn lb-next" aria-label="Nächstes Bild">›</button>
  </div>

  <dialog id="dialog"></dialog>
  <div id="upload-pill" class="upload-pill" hidden role="status" aria-live="polite">
    <div class="pill-bar"><div></div></div>
    <span class="pill-text">⬆️ Lade hoch …</span>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="exif.js"></script>
  <script src="app.js"></script>
</body>
</html>
