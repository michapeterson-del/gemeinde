<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3d5672">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mediathek">
  <title>Gemeinde-Mediathek</title>
  <meta name="description" content="Bilder, Gottesdienstaufnahmen, Texte und Dokumente unserer Gemeinde.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="wrap topbar-inner">
      <a href="#/" class="brand"><img class="brand-icon" src="icon.svg" alt="" width="28" height="28"> <span class="brand-name">Gemeinde-Mediathek</span></a>
      <nav class="topnav">
        <a href="#/" data-nav="/">Start</a>
        <a href="#/aktuelles" data-nav="/aktuelles">Aktuelles</a>
        <a href="#/gebet" data-nav="/gebet">Gebet</a>
        <a href="#/suche" data-nav="/suche">Suche</a>
        <a href="#/verwaltung" data-nav="/verwaltung" id="nav-admin" hidden>Verwaltung</a>
        <button class="btn small" id="nav-upload" hidden>＋ Hinzufügen</button>
        <a href="#/konto" data-nav="/konto" class="user-chip" id="nav-user" title="Mein Konto"></a>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite"></main>

  <nav class="bottomnav" id="bottomnav" hidden>
    <a href="#/" data-nav="/"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>Start</a>
    <a href="#/aktuelles" data-nav="/aktuelles"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span>Aktuelles</a>
    <a href="#/gebet" data-nav="/gebet"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg></span>Gebet</a>
    <a href="#/suche" data-nav="/suche"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>Suche</a>
    <a href="#/verwaltung" data-nav="/verwaltung" id="bottom-admin" hidden><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>Verwaltung</a>
    <a href="#/konto" data-nav="/konto"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>Konto</a>
  </nav>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-btn lb-close" aria-label="Schließen">✕</button>
    <button class="lb-btn lb-prev" aria-label="Vorheriges Bild">‹</button>
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <button class="lb-btn lb-next" aria-label="Nächstes Bild">›</button>
  </div>

  <!-- Fester Audio-Player: läuft beim Seitenwechsel und bei gesperrtem Handy weiter -->
  <div id="player" class="player" hidden>
    <input type="range" id="player-seek" min="0" max="0" step="1" value="0" aria-label="Position">
    <div class="player-row">
      <button class="player-btn" id="player-back" aria-label="15 Sekunden zurück"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><small>15</small></button>
      <button class="player-btn main" id="player-toggle" aria-label="Abspielen"></button>
      <button class="player-btn" id="player-fwd" aria-label="30 Sekunden vor"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><small>30</small></button>
      <div class="player-info">
        <div id="player-title" class="player-title"></div>
        <div class="player-sub"><span id="player-sub"></span> · <span id="player-time">0:00</span></div>
      </div>
      <button class="player-btn" id="player-close" aria-label="Player schließen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <audio id="player-audio" preload="metadata"></audio>
  </div>

  <dialog id="dialog"></dialog>
  <div id="upload-pill" class="upload-pill" hidden role="status" aria-live="polite">
    <div class="pill-bar"><div></div></div>
    <span class="pill-text">Hochladen …</span>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="exif.js"></script>
  <script src="app.js"></script>
</body>
</html>
